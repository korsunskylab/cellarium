findings:

  - id: FIND-001
    created: 2026-05-22
    status: open
    source: sandbox/V0_1_18S_coloring.ipynb

    conclusion: >
      Anisotropic diffusion of anchor density with linear-conductance from raw
      18S (σ_eff = 2 µm), followed by Dirichlet posterior with α=10 and grey-abstain
      at N_min=3, is the production recipe for transcript → per-pixel lineage
      posteriors on Xenium FFPE skin.

    evidence: >
      Tested on the 68-doublet dev set with DB_top100_031 (Fib × Mel) as primary
      walkthrough. Stage 3b sweep compared isotropic Gaussian KDE vs. anisotropic
      diffusion at σ ∈ {0.5, 1, 2, 4} µm; isotropic leaked across dim-18S
      inter-cell gaps, anisotropic did not. α sweep ∈ {0.5, 1, 5, 10, 20}:
      argmax flicker visible at α<5, absent at α≥5. Punctate-points artifact at
      naive n_iter = σ²/dt fixed by ANISO_N_ITER_FACTOR=4 (calibrated for typical
      cell-interior c²≈0.25). σ_diffuse=2 µm matches cytoplasmic mRNA spread in
      Xenium FFPE.

    reasoning: >
      Anisotropic diffusion uses per-edge conductance c(p)·c(q) where c is a
      1–99 percentile clip of raw 18S — diffusion is blocked at dim cytoplasm
      gaps, so anchor density respects cell-membrane morphology. Isotropic
      Gaussian KDE bleeds across these gaps and confounds neighboring cells.
      α controls how strongly the Dirichlet prior pulls π toward uniform; at low
      α a 1-2 anchor blip dominates locally, visible as argmax islands. N_min=3
      is the floor below which we explicitly grey-abstain rather than commit a
      lineage call. The 4× n_iter factor compensates for cell-interior conductance
      being c²≈0.25, not 1, so effective σ would otherwise be half the target.

    scope:
      applies_to: [Xenium]
      tissue_types: [skin]
      resolution_um_per_px: 0.2125
      known_exceptions: >
        Not tested in low-anchor-density tissue (immune-poor stroma, fibrotic
        regions) or for lineage pairs outside Fib/Mel/Myeloid/Tcell/Plasma/Endo/Kerat.
        PBMC and MERSCOPE not tested. The conductance calibration assumes
        Xenium FFPE 18S brightness range; very different staining conditions
        likely require recalibrating ANISO_TYPICAL_C2.

        PRODUCTION-VS-SANDBOX GAP (as of 2026-05-24): lib.py defines both
        lineage_posterior_anisotropic (this recipe) and the older isotropic
        lineage_posterior. The production notebooks (00_run_pipeline.ipynb,
        01_batch_dev_doublets.ipynb) and all 5 diagnostic _*.py scripts in
        pipelines/V0/ currently still call lib.lineage_posterior (isotropic).
        Only sandbox notebooks (V0_1, V0_2, V0_3, edge_detection_diagnostics)
        exercise the anisotropic recipe. Migration to anisotropic in the
        production tier is pending.

    affects:
      pipeline:
        - pipelines/V0/lib.py
        - pipelines/V0/00_run_pipeline.ipynb           # MIGRATION PENDING (uses isotropic)
        - pipelines/V0/01_batch_dev_doublets.ipynb     # MIGRATION PENDING (uses isotropic)
        - pipelines/V0/_audit_assumptions.py           # MIGRATION PENDING (uses isotropic)
        - pipelines/V0/_depth_histogram.py             # MIGRATION PENDING (uses isotropic)
        - pipelines/V0/_diagnose_cell_018.py           # MIGRATION PENDING (uses isotropic)
        - pipelines/V0/_normalization_variants.py      # MIGRATION PENDING (uses isotropic)
        - pipelines/V0/_sanity_binary_cut.py           # MIGRATION PENDING (uses isotropic)

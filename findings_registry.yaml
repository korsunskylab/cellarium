  - id: FIND-002
    created: 2026-05-22
    status: open
    source: sandbox/V0_2_boundary_estimation.ipynb

    conclusion: >
      The tanh-gradient continuous edge field thresholded at p99 (K_sharp=8,
      gated by confidence² · cell_evidence) is the production boundary detector
      on V0 posteriors. Argmax-based discrete detectors with a confidence>0.5
      gate are an acceptable fallback. Point-wise scalars of the posterior
      (margin, uncertainty 1−π_top1, entropy H(π)) do NOT work as boundary
      detectors and should not be re-added.

    evidence: >
      Tested 7 boundary detectors on DB_top100_031 and a 6-doublet zoom panel
      (026, 018, 015, 090, 082), plus the 68-doublet batch sweep. The three
      point-wise detectors (margin<0.10, (1−π_top1)>0.6, entropy>1.5) fired
      across the whole frame without spatial coherence — visible as speckle
      that did not trace lineage transitions, even on doublets where the
      gradient detector found clean boundaries. Argmax-raw fired on
      ~1-transcript noise pixels. Argmax & confidence>0.5 suppressed phantom
      stroma boundaries acceptably. tanh-gradient@p99 produced coherent
      boundaries inside dense-anchor regions on all 6 zoom-panel doublets.
      Method 8 (DiZenzo structure tensor) and the three point-wise detectors
      were culled 2026-05-22.

    reasoning: >
      Boundaries are inherently spatial-gradient objects — they are defined by
      where the lineage call CHANGES, not by where the lineage call is
      uncertain. Point-wise scalars (margin, uncertainty, entropy) measure
      pointwise ambiguity but carry no spatial-gradient information; high
      ambiguity at a single pixel is uninformative about whether a boundary
      passes through it. The tanh-gradient detector computes |∇ tanh(K · s_k)|
      per lineage where s_k is the signed margin; K_sharp=8 saturates s_k at ±1
      so the gradient peaks exactly at the sign-change line. The c² gate
      suppresses low-anchor stroma; cell_evidence suppresses inter-cell gaps.
      p99 percentile threshold is robust to the absolute magnitude of
      weighted_edge (which depends on K_sharp and anchor density).

    scope:
      applies_to: [Xenium]
      tissue_types: [skin]
      resolution_um_per_px: 0.2125
      known_exceptions: >
        Dev set was the top-100 brightest doublets; behaviour in dim-18S regions
        where N_total is much lower not characterised. Lineage pairs tested:
        Fib×Mel (031, 026, 018, 015, 090) and Fib×Plasma (082). Plasma×Endo,
        Kerat×Mel, and other less-frequent pairs not tested.

    affects:
      pipeline:
        - pipelines/V0/lib.py
        - pipelines/V0/00_run_pipeline.ipynb
      analyses: []

    depends_on: [FIND-001]

    action_taken: null
    superseded_by: null


  - id: FIND-003
    created: 2026-05-24
    status: open
    source: sandbox/V0_2_boundary_estimation.ipynb

    conclusion: >
      Per-lineage edge field should be e_k = ‖∇ max(t_k, 0)‖, not
      ‖∇ tanh(K_sharp · s_k)‖. Clipping t_k to [0, 1] before the gradient
      restricts e_k to fire only at the perimeter of regions where lineage k
      is winning; the original formulation also fires on transitions between
      two non-k-winning regions, which is conceptually wrong and empirically
      noisy.

    evidence: >
      Diagnostics on DB_top100_031 (Fib × Mel), 2026-05-24
      (see scratch/figures/xenium_skin_db031_bug1-fix_relu-clip_K-sharp8.png
      and xenium_skin_db031_e-fib-bugs_anisotropic-sigma2_K-sharp8.png).
      Spurious-pixel test: at (y=195, x=243), no Fib anchor within 20 px
      (distance 4.3 µm), t_Fib = −0.88 (Fib clearly losing). Original
      e_Fib = 4.45; clipped e_Fib = 0.00. Aggregate: 66% of previously
      bright pixels (e_Fib > 0.5) drop to exactly 0 under the clip. Among
      the surviving 8,174 bright clipped pixels, every single one has a
      positive t_Fib neighbour within a 3×3 window (zero false positives
      verified). Real focal-cell Fib boundary preserved
      (e_Fib max in focal: 3.66 → 2.94). Off/focal ratio improved on
      edge_total (4.17× → 2.82×) and on weighted_edge (5.41× → 4.18×).

    reasoning: >
      With K_sharp = 8, tanh(K · s_k) is near a step function at s_k = 0.
      Its Sobel gradient fires strongly across any zero-crossing — including
      transitions where s_k flips from "slightly losing" to "strongly losing"
      (lineage k never wins on either side). The clip max(t_k, 0) is
      identically zero wherever t_k ≤ 0, so its gradient vanishes outside
      k-winning territory. Conceptually: a "lineage k boundary" is the
      perimeter of the region where k wins, and that is exactly what
      ‖∇ max(t_k, 0)‖ traces.

    scope:
      applies_to: [Xenium]
      tissue_types: [skin]
      resolution_um_per_px: 0.2125
      known_exceptions: >
        Only verified on DB_top100_031; needs confirmation on the broader
        6-doublet zoom panel (026, 018, 015, 090, 082) and the 68-doublet
        batch before being treated as universally validated. The fix does
        NOT resolve off-focal-dominance (Mel cell-perimeter edges still
        dominate the global p99 — n_bnd_in_focal still 0 on this doublet),
        and does NOT address the anisotropic-diffusion rescaling issue
        (Bug 2; tabled this session).

    affects:
      pipeline:
        - pipelines/V0/lib.py
        - pipelines/V0/00_run_pipeline.ipynb
      analyses: []

    depends_on: [FIND-002]

    action_taken: null
    superseded_by: null
